name: Check and release

# The released font is exported from Glyphs and committed as fonts/RemusVariableVF.ttf.
# This workflow checks that file and publishes it; it does not rebuild it from source.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install -r requirements.txt
      - name: Fontbakery
        # Soft-fail until the open findings (see README) are resolved.
        continue-on-error: true
        run: |
          mkdir -p build
          fontbakery check-universal -l WARN -x fontdata_namecheck --html build/fontbakery.html fonts/RemusVariableVF.ttf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fontbakery-report
          path: build/fontbakery.html
          if-no-files-found: ignore

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="remus-${GITHUB_REF_NAME}"
          mkdir -p "dist/$NAME"
          cp fonts/RemusVariableVF.ttf fonts/RemusVariableVF.woff fonts/RemusVariableVF.woff2 "dist/$NAME/"
          cp GUST-FONT-LICENSE.txt MANIFEST-Remus-Variable.txt README-Remus-Variable.txt \
             MANIFEST-TeX-Gyre-Heros.txt README-TeX-Gyre-Heros.txt AUTHORS.txt CONTRIBUTORS.txt "dist/$NAME/"
          (cd dist && zip -r "$NAME.zip" "$NAME")
          gh release create "$GITHUB_REF_NAME" "dist/$NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
